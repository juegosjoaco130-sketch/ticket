<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mis pedidos | Dely</title>

    <link rel="stylesheet" href="../css/estilos.css">

    <script src="../js/repartidor.js" defer></script>

</head>

<body>
    <header>
        <h1>Mis pedidos asignados</h1>

        <button id="boton-logout" type="button">
            Cerrar sesión
        </button>
    </header>

    <main>
        <section>
            <h2 id="titulo-formulario">Cambiar estado</h2>

            <form id="formulario-pedido">
                <input
                    type="hidden"
                    id="id-pedido"
                >

                <p id="resumen-pedido">
                    Seleccioná un pedido de la lista para cambiar su estado.
                </p>

                <div>
                    <label for="estado">Estado</label>

                    <select id="estado" required>
                        <option value="">
                            Selecciona un estado
                        </option>
                    </select>
                </div>

                <p id="mensaje-error" role="alert" hidden></p>
                <p id="mensaje-exito" role="status" hidden></p>

                <button type="submit">
                    Guardar estado
                </button>

                <button
                    id="boton-cancelar"
                    type="button"
                    hidden
                >
                    Cancelar
                </button>
            </form>
        </section>

        <section>
            <h2>Pedidos asignados</h2>

            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Teléfono</th>
                        <th>Dirección</th>
                        <th>Descripción</th>
                        <th>Prioridad</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody id="lista-pedidos"></tbody>
            </table>

            <p id="sin-pedidos" hidden>
                No tenés pedidos asignados.
            </p>
        </section>
    </main>
</body>
</html>
