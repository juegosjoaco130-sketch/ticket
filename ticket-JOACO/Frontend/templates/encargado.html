<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gestión de pedidos | Dely</title>

    <link rel="stylesheet" href="../css/estilos.css">

    <script src="../js/encargado.js" defer></script>

</head>

<body>
    <header>
        <h1>Gestión de pedidos</h1>

        <nav>
            <a href="crear-usuario.html">
                Crear usuario
            </a>

            <a href="criterios-prioridad.html">
                Criterios de prioridad
            </a>

            <button id="boton-logout" type="button">
                Cerrar sesión
            </button>
        </nav>
    </header>

    <main>
        <section>
            <h2 id="titulo-formulario">
                Crear pedido
            </h2>

            <form id="formulario-pedido">
                <input
                    type="hidden"
                    id="id-pedido"
                >

                <div>
                    <label for="cliente">
                        Cliente
                    </label>

                    <input
                        type="text"
                        id="cliente"
                        maxlength="100"
                        required
                    >
                </div>

                <div>
                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        maxlength="20"
                        required
                    >
                </div>

                <div>
                    <label for="direccion">
                        Dirección
                    </label>

                    <input
                        type="text"
                        id="direccion"
                        maxlength="255"
                        required
                    >
                </div>

                <div>
                    <label for="descripcion">
                        Descripción
                    </label>

                    <textarea
                        id="descripcion"
                        maxlength="2000"
                        required
                    ></textarea>
                </div>

                <div>
                    <label for="prioridad">
                        Prioridad
                    </label>

                    <select id="prioridad" required>
                        <option value="">
                            Selecciona una prioridad
                        </option>
                    </select>
                </div>

                <div id="contenedor-estado" hidden>
                    <label for="estado">Estado</label>

                    <select id="estado">
                        <option value="">
                            Selecciona un estado
                        </option>
                    </select>
                </div>

                <div id="contenedor-repartidor" hidden>
                    <label for="repartidor">Repartidor</label>

                    <select id="repartidor">
                        <option value="">
                            Sin asignar
                        </option>
                    </select>
                </div>

                <p id="mensaje-error" role="alert" hidden></p>
                <p id="mensaje-exito" role="status" hidden></p>

                <button type="submit">
                    Crear pedido
                </button>

                <button
                    id="boton-cancelar"
                    type="button"
                    hidden
                >
                    Cancelar modificación
                </button>
            </form>
        </section>

        <section>
            <h2>Todos los pedidos</h2>

            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Teléfono</th>
                        <th>Dirección</th>
                        <th>Descripción</th>
                        <th>Prioridad</th>
                        <th>Estado</th>
                        <th>Repartidor</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody id="lista-pedidos"></tbody>
            </table>

            <p id="sin-pedidos" hidden>
                No existen pedidos registrados.
            </p>
        </section>
    </main>
</body>
</html>
