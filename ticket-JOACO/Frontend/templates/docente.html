<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mis tickets</title>

    <link rel="stylesheet" href="../css/estilos.css">

    <script src="../js/docente.js" defer></script>
    <style> *{color: #ffffff; background-color: #111;} </style>
</head>

<body>
    <header>
        <h1>Mis tickets abiertos</h1>

        <button id="boton-logout" type="button">
            Cerrar sesión
        </button>
    </header>

    <main>
        <section>
            <h2 id="titulo-formulario">Crear ticket</h2>

            <form id="formulario-ticket">
                <input
                    type="hidden"
                    id="id-ticket"
                >

                <div>
                    <label for="descripcion">
                        Descripción
                    </label>

                    <textarea
                        id="descripcion"
                        maxlength="2000"
                        required
                    ></textarea>
                </div>

                <div>
                    <label for="sala">Sala</label>

                    <select id="sala">
                        <option value="">
                            Sin sala
                        </option>
                        <option value="Salón 5">Salón 5</option>
                        <option value="Salón 6">Salón 6</option>
                        <option value="Salón 7">Salón 7</option>
                        <option value="Adscripción">Adscripción</option>
                        <option value="Dirección">Dirección</option>
                        <option value="Campus">Campus</option>
                    </select>
                </div>

                <div>
                    <label for="prioridad">Prioridad</label>

                    <select id="prioridad" required>
                        <option value="">
                            Selecciona una prioridad
                        </option>
                    </select>
                     <p>
                        <a href="criterios-prioridad.html">
                            Consultar criterios de prioridad
                        </a>
                    </p>
                </div>

                <p id="mensaje-error" role="alert" hidden></p>
                <p id="mensaje-exito" role="status" hidden></p>

                <button type="submit">
                    Crear ticket
                </button>

                <button
                    id="boton-cancelar"
                    type="button"
                    hidden
                >
                    Cancelar modificación
                </button>
            </form>
        </section>

        <section>
            <h2>Tickets abiertos</h2>

            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Descripción</th>
                        <th>Sala</th>
                        <th>Prioridad</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody id="lista-tickets"></tbody>
            </table>

            <p id="sin-tickets" hidden>
                No tienes tickets abiertos.
            </p>
        </section>
    </main>
</body>
</html>
