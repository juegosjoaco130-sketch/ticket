<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Crear usuario | Sistema de Tickets</title>

    <link rel="stylesheet" href="../css/estilos.css">

    <script src="../js/crear-usuario.js" defer></script>

</head>

<body>
    <header>
        <h1>Crear usuario</h1>

        <nav>
            <a href="encargado.html">Volver</a>
        </nav>
    </header>

    <main>
        <form id="formulario-usuario">
            <!--B03-corr: la tabla real usa nombre/apellido (no existe cedula).-->
            <div>
                <label for="nombre">Nombre</label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    autocomplete="given-name"
                    required
                >
            </div>

            <div>
                <label for="apellido">Apellido</label>

                <input
                    type="text"
                    id="apellido"
                    name="apellido"
                    autocomplete="family-name"
                    required
                >
            </div>

            <div>
                <label for="usuario">Nombre de usuario</label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    minlength="3"
                    maxlength="50"
                    autocomplete="username"
                    required
                >
            </div>

            <div>
                <label for="password">Contraseña</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div>
                <label for="rol">Rol</label>

                <select id="rol" name="rol" required>
                    <option value="">Selecciona un rol</option>
                    <option value="repartidor">Repartidor</option>
                    <option value="encargado">Encargado</option>
                </select>
            </div>

            <p id="mensaje-error" role="alert" hidden></p>

            <p id="mensaje-exito" role="status" hidden></p>

            <button type="submit">
                Crear usuario
            </button>
        </form>
    </main>
</body>
</html>
