<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Crear usuario | Dely</title>

    <link rel="stylesheet" href="../css/estilos.css">

    <script src="../js/crear-usuario.js" defer></script>

</head>

<body class="dely-app">
    <header class="dely-app__encabezado">
        <h1 class="dely-app__titulo">Crear usuario</h1>

        <nav class="dely-app__nav">
            <a class="dely-app__enlace" href="encargado.html">Volver</a>
        </nav>
    </header>

    <main class="dely-app__principal">
        <form id="formulario-usuario">
            <div class="dely-app__campo">
                <label class="dely-app__etiqueta" for="cedula">Cédula</label>

                <input class="dely-app__input"
                    type="text"
                    id="cedula"
                    name="cedula"
                    minlength="8"
                    maxlength="8"
                    inputmode="numeric"
                    required
                >
            </div>

            <div class="dely-app__campo">
                <label class="dely-app__etiqueta" for="nombre">Nombre</label>

                <input class="dely-app__input"
                    type="text"
                    id="nombre"
                    name="nombre"
                    autocomplete="given-name"
                    required
                >
            </div>

            <div class="dely-app__campo">
                <label class="dely-app__etiqueta" for="apellido">Apellido</label>

                <input class="dely-app__input"
                    type="text"
                    id="apellido"
                    name="apellido"
                    autocomplete="family-name"
                    required
                >
            </div>

            <div class="dely-app__campo">
                <label class="dely-app__etiqueta" for="usuario">Nombre de usuario</label>

                <input class="dely-app__input"
                    type="text"
                    id="usuario"
                    name="usuario"
                    minlength="3"
                    maxlength="50"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="dely-app__campo">
                <label class="dely-app__etiqueta" for="password">Contraseña</label>

                <input class="dely-app__input"
                    type="password"
                    id="password"
                    name="password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="dely-app__campo">
                <label class="dely-app__etiqueta" for="rol">Rol</label>

                <select class="dely-app__input" id="rol" name="rol" required>
                    <option value="">Selecciona un rol</option>
                    <option value="repartidor">Repartidor</option>
                    <option value="encargado">Encargado</option>
                </select>
            </div>

            <p class="dely-app__error" id="mensaje-error" role="alert" hidden></p>

            <p class="dely-app__exito" id="mensaje-exito" role="status" hidden></p>

            <button class="dely-app__boton" type="submit">
                Crear usuario
            </button>
        </form>
    </main>
</body>
</html>
